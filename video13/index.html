<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Starts</title>
    <style> 
        div {
            background-color: red;
            color: white;
            padding: 10px;
            margin: 10px;
        }
        span{
            color: blue;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div>
        This is a div element.
    </div>
    <p>
        This is a paragraph element with a <span>span inside it</span>. Did you see that? 
    </p>
</body>
</html>
