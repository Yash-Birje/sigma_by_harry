<div class="container-fluid">
<form action ='/analyze' method = "get">
<div class="alert alert-warning" role="alert">
 Welcome to text analyzer.
</div>
  <div class="form-floating">
    Let TextUtils do it's magic according to your needs.
    <label for="floatingTextarea">Please Enter your text here.</label>
  <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea" style="width:80vw" name = "text"></textarea>
  
</div>
<div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault" name="removepunc">
  <label class="form-check-label" for="switchCheckDefault">Remove Punctuation</label>
</div>
<div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" role="switch" id="switchCheckChecked" checked name="fullcaps">
  <label class="form-check-label" for="switchCheckChecked">Upper Case</label>
</div>
<div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDisabled" name='newlineremover'>
  <label class="form-check-label" for="switchCheckDisabled">New Line Remover</label>
</div>
<div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" role="switch" id="switchCheckCheckedDisabled" checked name = 'charcount'>
  <label class="form-check-label" for="switchCheckCheckedDisabled">get character count</label>
</div>
<button class="btn btn-outline-info" type="submit">Analyze This</button>
</form>
</div>
