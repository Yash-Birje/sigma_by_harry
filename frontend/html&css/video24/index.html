<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            border: 2px solid black;
            padding: 20px;
            margin: 20px;
            box-shadow:  5px 15px 5px pink ;
        }
        .box:hover{
            box-shadow: inset 7px 10px 20px 5px darkblue;
        }
    </style>
</head>
<body>
    <div class="box">
        I am a box with a border.
    </div>
    <div class="box">
        I am also another box with a border.
    </div>
    
</body>
</html>
